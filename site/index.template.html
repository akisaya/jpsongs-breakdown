<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>歌詞精読 · 日语歌词拆解合集</title>
<meta name="description" content="日文歌词逐句解析：完整歌词、注音精读、核心词汇、语法图谱。收录动画、日剧与 J-POP 共 {{SITE_SONG_COUNT}} 首。">
<meta name="theme-color" content="#FBF6EF">
<!--__SITE_PRELOAD__-->
<style>
/* ============================================================
   0. 设计变量（与歌曲页共用同一套）
   ============================================================ */
:root{
  --bg:#FBF6EF;
  --surface:#FFFFFF;
  --ink:#1F232A;
  --ink-2:#4C525C;
  --ink-3:#828893;
  --line:#E8DCCB;
  --orange:#D9541F;
  --teal:#1E8A7E;
  --teal-soft:#E4F2EE;

  --font-sans:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif;
  --font-sans-ja:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans CJK JP","Noto Sans JP",sans-serif;
  --font-serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",Georgia,"Songti SC",serif;
  --font-serif-zh:"Songti SC","SimSun","Noto Serif CJK SC","Noto Serif SC",serif;
  --font-display:"Didot","Bodoni 72",Georgia,"Times New Roman",serif;

  --shadow-xs:0 1px 2px rgba(84,56,24,.05);
  --shadow-sm:0 1px 2px rgba(84,56,24,.05),0 4px 12px -6px rgba(84,56,24,.14);
  --shadow-md:0 2px 4px rgba(84,56,24,.05),0 14px 34px -14px rgba(84,56,24,.22);

  --r-md:16px;
  --r-lg:22px;
  --r-xl:30px;
}

*,*::before,*::after{box-sizing:border-box}

html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}

body{
  margin:0;
  font-family:var(--font-sans);
  font-size:1rem;
  line-height:1.75;
  color:var(--ink);
  background:
    radial-gradient(1100px 560px at 88% -12%, rgba(255,224,190,.85) 0%, rgba(255,224,190,0) 62%),
    radial-gradient(820px 480px at -8% 4%, rgba(214,238,231,.75) 0%, rgba(214,238,231,0) 58%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
  min-block-size:100vh;
}

.wrap{width:min(100% - 2.5rem, 1000px);margin-inline:auto}
@media (max-width:600px){.wrap{width:calc(100% - 1.8rem)}}

a{color:inherit;text-decoration:none}
:where([lang="ja"]){font-family:var(--font-sans-ja)}

/* ============================================================
   1. 顶栏
   ============================================================ */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:1rem;
  padding:1.5rem 0 0;
}
.brand{display:flex;align-items:baseline;gap:.6rem}
.brand b{
  font-family:var(--font-serif);
  font-size:1.02rem;font-weight:600;letter-spacing:.16em;
  color:var(--ink);
}
.brand span{
  font-size:.6rem;letter-spacing:.22em;color:var(--ink-3);
  text-transform:uppercase;
}
@media (max-width:560px){.brand span{display:none}}

/* ============================================================
   2. 开场
   ============================================================ */
.intro{padding:clamp(3.2rem,8vw,5.4rem) 0 0}

.intro-kicker{
  margin:0 0 1.1rem;
  font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;
  color:var(--orange);font-weight:700;
}
.intro h1{
  margin:0;
  font-family:var(--font-serif-zh);
  font-style:normal;
  font-weight:400;
  font-size:clamp(2.4rem,6.6vw,4.35rem);
  line-height:1.02;
  letter-spacing:-.015em;
  text-wrap:balance;
  color:#262A31;
}
.intro h1 em{
  font-style:inherit;
  background:linear-gradient(96deg,var(--orange) 0%,#C43F1B 46%,#9A3416 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.intro-lead{
  margin:1.5rem 0 0;
  max-width:46ch;
  font-size:.95rem;line-height:1.95;color:var(--ink-2);
  text-wrap:pretty;
}
.intro-lead b{color:var(--ink);font-weight:600}

/* 统计条 */
.tally{
  margin-top:clamp(2.2rem,5vw,3.2rem);
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  background:rgba(255,255,255,.68);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  backdrop-filter:blur(10px);
  box-shadow:var(--shadow-sm);
  overflow:hidden;
}
.tally div{
  padding:1.1rem 1rem;
  text-align:center;
  border-left:1px solid var(--line);
}
.tally div:first-child{border-left:0}
.tally b{
  display:block;
  font-family:var(--font-display);
  font-style:italic;
  font-size:1.75rem;line-height:1.1;
  color:var(--orange);
}
.tally span{
  display:block;margin-top:.28rem;
  font-size:.63rem;letter-spacing:.16em;color:var(--ink-3);
}
@media (max-width:600px){
  .tally{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tally div:nth-child(3){border-left:0}
  .tally div:nth-child(n+3){border-top:1px solid var(--line)}
}

/* ============================================================
   3. 曲目列表
   ============================================================ */
.list{padding:clamp(3.2rem,7vw,4.6rem) 0 0}

.list-head{
  display:flex;align-items:baseline;justify-content:space-between;
  flex-wrap:wrap;
  gap:1rem;
  margin-bottom:1.15rem;
}
.list-title{display:flex;align-items:baseline;gap:.8rem}
.list-head h2{
  margin:0;
  font-size:.72rem;font-weight:700;
  letter-spacing:.24em;text-transform:uppercase;
  color:var(--ink-2);
}
.list-count{font-size:.72rem;color:var(--ink-3);letter-spacing:.06em}

/* 工具栏右缘与卡片右缘对齐，左缘落在右侧卡片列的起点（= 卡片列宽） */
.directory-tools{
  display:flex;align-items:center;justify-content:space-between;
  gap:.55rem;
  flex:0 0 auto;
  width:calc(50% - .45rem);   /* 与 .songs 的列宽一致：gap .9rem 的一半 */
}
.search-box,.artist-trigger{
  min-width:0;height:40px;
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(255,255,255,.7);
  color:var(--ink-2);
  transition:border-color .18s ease,background .18s ease,box-shadow .18s ease;
}
.search-box{position:relative;display:flex;align-items:center;flex:1 1 0;min-width:0}
.search-box:focus-within,.artist-trigger:focus-visible,.artist-trigger[aria-expanded="true"]{
  border-color:var(--orange);
  background:var(--surface);
  box-shadow:0 0 0 3px rgba(217,84,31,.1);
}
.artist-trigger:focus-visible{outline:0}
.search-box svg{
  position:absolute;left:.72rem;
  width:15px;height:15px;
  color:var(--ink-2);
  pointer-events:none;
}
.search-box input{
  appearance:none;
  width:100%;height:100%;
  padding:0 .75rem 0 2.2rem;
  border:0;border-radius:inherit;
  background:transparent;outline:0;
  color:var(--ink);font:inherit;font-size:.72rem;
}
.search-box input::placeholder{color:var(--ink-3);opacity:1}

.artist-picker{position:relative;flex:0 0 220px;min-width:0;height:40px}
.artist-trigger{
  display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  width:100%;padding:0 .7rem 0 .75rem;
  background:rgba(255,255,255,.7);
  text-align:left;cursor:pointer;
}
.artist-trigger-copy{display:flex;align-items:center;gap:.52rem;min-width:0}
.artist-trigger-copy small{
  flex:0 0 auto;
  font-size:.58rem;letter-spacing:.08em;color:var(--ink-3);
}
.artist-trigger-copy b{
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:.7rem;font-weight:400;color:var(--ink-2);
}
.artist-trigger>svg{
  flex:0 0 auto;width:14px;height:14px;
  transition:transform .18s ease;
}
.artist-trigger[aria-expanded="true"]>svg{transform:rotate(180deg)}
.artist-menu{
  position:absolute;z-index:20;top:calc(100% + .45rem);left:0;right:0;
  width:100%;
  padding:.5rem;
  border:1px solid var(--line);border-radius:16px;
  background:rgba(255,252,247,.98);
  box-shadow:0 18px 42px -18px rgba(59,35,14,.42),var(--shadow-sm);
  backdrop-filter:blur(14px);
}
.artist-menu[hidden]{display:none}
.artist-menu-search{
  position:relative;display:flex;align-items:center;
  height:34px;margin-bottom:.35rem;
  border:1px solid var(--line);border-radius:10px;
  background:#FFFCF7;
}
.artist-menu-search svg{
  position:absolute;left:.6rem;width:13px;height:13px;color:var(--ink-3);pointer-events:none;
}
.artist-menu-search input{
  appearance:none;width:100%;height:100%;
  padding:0 .6rem 0 1.85rem;
  border:0;border-radius:inherit;background:transparent;outline:0;
  color:var(--ink);font:inherit;font-size:.68rem;
}
.artist-menu-search input::placeholder{color:var(--ink-3);opacity:1}
.artist-options{max-height:260px;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}
.artist-option{
  display:flex;align-items:center;justify-content:space-between;gap:.7rem;
  width:100%;padding:.54rem .58rem;
  border:0;border-radius:9px;background:transparent;
  color:var(--ink-2);font:inherit;font-size:.72rem;text-align:left;
  cursor:pointer;
}
.artist-option>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artist-option:hover,.artist-option:focus-visible{background:#F5EDE2;outline:0;color:var(--ink)}
.artist-option[aria-selected="true"]{background:var(--teal-soft);color:#166D64;font-weight:600}
.artist-option small{font-size:.62rem;font-weight:400;color:var(--ink-3);font-variant-numeric:tabular-nums}
.artist-option-empty{padding:.75rem .6rem;font-size:.68rem;color:var(--ink-3);text-align:center}

/* 卡片改成单列后，工具栏不再需要按列宽对齐 */
@media (max-width:860px){
  .directory-tools{width:auto}
  .search-box{flex:0 0 280px}
}
@media (max-width:760px){
  .directory-tools{display:grid;grid-template-columns:1fr;width:100%}
  .search-box{flex:1 1 auto;width:100%}
  .artist-picker{width:100%}
}
@media (max-width:700px){.list-head{align-items:stretch}}

.songs{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:.9rem;
}
@media (max-width:860px){.songs{grid-template-columns:minmax(0,1fr)}}

.empty{
  padding:2.5rem 1.25rem;
  border:1px dashed #DECCB2;
  border-radius:var(--r-lg);
  background:rgba(255,255,255,.48);
  text-align:center;
}
.empty[hidden]{display:none}
.empty b{display:block;font-family:var(--font-serif);font-size:1rem;font-weight:600}
.empty span{display:block;margin-top:.25rem;font-size:.74rem;color:var(--ink-3)}
.empty button{
  margin-top:1rem;padding:.42rem .75rem;
  border:1px solid var(--line);border-radius:999px;
  background:var(--surface);color:var(--orange);
  font:inherit;font-size:.72rem;font-weight:600;cursor:pointer;
}
.empty button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

.pager{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  margin-top:1.65rem;padding-top:1rem;
  border-top:1px solid var(--line);
}
.pager[hidden]{display:none}
.pager-summary{font-size:.66rem;color:var(--ink-3);letter-spacing:.02em;white-space:nowrap}
.pager-pages{display:flex;align-items:center;justify-content:flex-end;gap:.28rem;flex-wrap:wrap}
.pager button{
  min-width:30px;height:30px;padding:0 .55rem;
  border:1px solid var(--line);border-radius:9px;
  background:rgba(255,255,255,.68);color:var(--ink-2);
  font:inherit;font-size:.66rem;cursor:pointer;
}
.pager button:hover:not(:disabled){border-color:#DCC7AA;background:var(--surface);color:var(--ink)}
.pager button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.pager button[aria-current="page"]{border-color:var(--ink);background:var(--ink);color:#FFFDF8}
.pager button:disabled{opacity:.35;cursor:default}
.pager-ellipsis{display:inline-grid;place-items:center;min-width:20px;height:30px;color:var(--ink-3);font-size:.72rem}
@media (max-width:560px){
  .pager{align-items:flex-start;flex-direction:column}
  .pager-pages{width:100%;justify-content:flex-start}
}

.song{
  display:flex;align-items:stretch;gap:1rem;
  padding:1rem;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-xs);
  transition:transform .22s cubic-bezier(.2,.7,.3,1),box-shadow .22s ease,border-color .22s ease;
  min-width:0;
}
.song:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow-md);
  border-color:#E2CFB6;
}
.song:focus-visible{
  outline:2px solid var(--orange);
  outline-offset:3px;
}

/* 迷你排版封面 */
.cov{
  --cov:128px;
  flex:0 0 var(--cov);
  inline-size:var(--cov);
  block-size:var(--cov);
  align-self:center;
  margin:0;
  border-radius:12px;
  padding:.5rem .55rem;
  display:flex;flex-direction:column;justify-content:space-between;
  color:#FFF8ED;
  position:relative;overflow:hidden;
  transform:rotate(-2deg);
  transition:transform .3s cubic-bezier(.2,.7,.3,1);
  box-shadow:0 12px 24px -14px rgba(60,30,10,.55);
}
.song:hover .cov{transform:rotate(0deg) scale(1.02)}
/* 双类名：窄屏的 .cov{--cov:98px;padding:…} 写在后面，单类名会被它盖掉 */
.cov.cov--img{padding:0;background:var(--bg-deep);align-items:stretch}
.cov--img::before{display:none}
.cov--img picture{display:contents}
.cov--img img{inline-size:100%;block-size:100%;object-fit:cover;border-radius:inherit;display:block}

.cov::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(to right, rgba(255,255,255,.12) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.12) 1px, transparent 1px);
  background-size:16px 16px;
  -webkit-mask-image:radial-gradient(circle at 50% 30%, #000 0%, transparent 78%);
  mask-image:radial-gradient(circle at 50% 30%, #000 0%, transparent 78%);
}
.cov-top{
  display:flex;justify-content:space-between;gap:.3rem;
  font-size:.4rem;letter-spacing:.13em;opacity:.82;
  position:relative;
}
.cov-mid{position:relative;display:flex;flex-direction:column;gap:.3rem}
.cov-work{font-size:.37rem;letter-spacing:.13em;opacity:.72;text-transform:uppercase}
.cov-title{
  font-family:var(--font-display);font-style:italic;
  font-size:.82rem;line-height:1.08;letter-spacing:-.01em;
  color:#FFFDF8;
}
.cov-artist{font-size:.42rem;letter-spacing:.15em;opacity:.86;margin-top:.1rem}
.cov-foot{
  display:flex;justify-content:space-between;gap:.3rem;
  font-size:.37rem;letter-spacing:.11em;opacity:.8;
  padding-top:.3rem;
  border-top:1px solid rgba(255,255,255,.26);
  position:relative;
}
.cov.t-teal{background:radial-gradient(125% 95% at 76% 8%, #46A99A 0%, #276E76 34%, #123A47 70%, #08202A 100%)}
.cov.t-rust{background:radial-gradient(125% 95% at 76% 8%, #C4664A 0%, #8E3A2A 36%, #4E1D18 72%, #26100E 100%)}

/* 卡片正文 */
.song-body{
  display:flex;flex-direction:column;
  min-width:0;flex:1 1 auto;
  padding-block:.1rem;
}
.song-kicker{
  margin:0;
  font-size:.6rem;letter-spacing:.08em;
  color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.song-title{
  margin:.28rem 0 0;
  font-family:var(--font-display);font-style:italic;font-weight:400;
  font-size:1.42rem;line-height:1.08;letter-spacing:-.01em;
  color:#262A31;
}
.song-by{
  margin:.2rem 0 0;
  font-family:var(--font-serif);
  font-size:.74rem;letter-spacing:.05em;color:var(--ink-2);
}
/* 大致难度：不是考试级别判定，只是给个参考档位 */
.song-lv{
  display:inline-block;
  margin-left:.45rem;
  padding:.08em .52em;
  border-radius:999px;
  border:1px solid #EADCC6;
  background:#FFF8EC;
  color:#8A5B14;
  font-family:var(--font-sans);
  font-size:.63rem;
  letter-spacing:.02em;
  white-space:nowrap;
  vertical-align:.06em;
}
.song-desc{
  margin:.6rem 0 0;
  font-size:.78rem;line-height:1.72;color:var(--ink-3);
  /* 固定 3 行高度：两列并排时描述长短不一也不会让下半部错位 */
  min-block-size:5.16em;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
  overflow:hidden;
}
.song-foot{
  margin-top:auto;padding-top:.7rem;
  display:flex;align-items:center;justify-content:space-between;
  gap:.6rem;
  font-size:.68rem;color:var(--ink-3);
}
.song-scale{letter-spacing:.02em;white-space:nowrap}
.song-go{
  display:inline-flex;align-items:center;gap:.3rem;
  color:var(--orange);font-weight:600;white-space:nowrap;
  transition:gap .2s ease;
}
.song:hover .song-go{gap:.55rem}
.song-go svg{width:12px;height:12px}

/* 掌握进度：只有该曲有本地记录时才出现 */
.song-prog{
  display:inline-flex;align-items:center;gap:.3rem;
  margin-left:.45rem;padding-left:.5rem;
  border-left:1px solid var(--line);
  color:var(--teal);font-size:.66rem;letter-spacing:.02em;
}
.song-prog i{
  display:block;width:30px;height:3px;border-radius:2px;
  background:#E4EDE9;overflow:hidden;
}
.song-prog i b{display:block;height:100%;background:var(--teal);border-radius:2px}

@media (max-width:520px){
  .cov{--cov:98px;padding:.46rem .5rem}
  .cov-title{font-size:.78rem}
  .cov-work,.cov-top,.cov-foot,.cov-artist{font-size:.35rem}
  .song{gap:.85rem;padding:.9rem}
  .song-title{font-size:1.24rem}
  /* 窄屏不截断：纵向排列，两张卡不等高也不刺眼 */
  .song-desc{-webkit-line-clamp:unset;min-block-size:0}
}

/* ============================================================
   4. 页脚
   ============================================================ */
.foot{
  padding:clamp(3rem,6vw,4rem) 0 3rem;
  margin-top:clamp(2.4rem,5vw,3.4rem);
  border-top:1px solid var(--line);
}
.foot-inner{display:flex;flex-wrap:wrap;gap:1.4rem;justify-content:space-between;align-items:flex-start}
.foot-note{
  margin:0;max-width:56ch;
  font-size:.74rem;line-height:1.85;color:var(--ink-3);
  text-wrap:pretty;
}
.foot-meta{
  margin:0;text-align:right;
  font-size:.62rem;letter-spacing:.16em;line-height:2;
  color:var(--ink-3);text-transform:uppercase;
}
@media (max-width:560px){
  .foot-meta{text-align:left}
}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<header class="topbar wrap">
  <a class="brand" href="./">
    <b lang="ja">歌詞精読</b>
    <span>Lyrics Breakdown</span>
  </a>
</header>

<main>
  <section class="intro wrap">
    <p class="intro-kicker">Japanese Lyrics · 逐句解析</p>
    <h1>把一首歌，<br>拆成<em>看得懂的句子</em></h1>
    <p class="intro-lead">
      每首歌拆成 20 多张卡片：完整歌词、带注音的句子、句中单词、语法点，以及一句「唱的时候才会注意到的细节」。
      不追求「学完就能考级」，只求<b>你把这首歌真的听懂、唱顺</b>。
    </p>
    <div class="tally" id="tally"></div>
  </section>

  <section class="list wrap">
    <div class="list-head">
      <div class="list-title">
        <h2>曲目</h2>
        <span class="list-count" id="list-count" aria-live="polite"></span>
      </div>
      <div class="directory-tools">
        <label class="search-box">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input id="song-search" type="search" autocomplete="off" placeholder="搜索歌曲、歌手或作品" aria-label="搜索歌曲、歌手或作品">
        </label>
        <div class="artist-picker" id="artist-picker">
          <button class="artist-trigger" id="artist-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="artist-menu">
            <span class="artist-trigger-copy">
              <small>歌手</small>
              <b id="artist-trigger-label">全部</b>
            </span>
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="artist-menu" id="artist-menu" hidden>
            <label class="artist-menu-search">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/>
                <path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              <input id="artist-menu-search" type="search" autocomplete="off" placeholder="查找歌手" aria-label="查找歌手">
            </label>
            <div class="artist-options" id="artist-options" role="listbox" aria-label="选择歌手"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="songs" id="songs"></div>
    <div class="empty" id="empty" hidden>
      <b>没有找到匹配的曲目</b>
      <span>试试其他歌曲名、歌手或作品名。</span>
      <button type="button" id="reset-directory">显示全部曲目</button>
    </div>
    <nav class="pager" id="pager" aria-label="曲目分页" hidden>
      <span class="pager-summary" id="pager-summary" aria-live="polite"></span>
      <div class="pager-pages" id="pager-pages"></div>
    </nav>
  </section>
</main>

<footer class="foot wrap">
  <div class="foot-inner">
    <p class="foot-note">
      本站为个人日语学习用途的歌词解析作品，非官方发布。歌词著作权归各曲作词、作曲、演唱者及相关权利方所有；
      页面内容仅供学习参考，请勿用于商业用途。请通过正版音源与官方歌词页对照收听。
    </p>
    <p class="foot-meta">
      Lyrics Breakdown<br>
      逐句解析 · 完整歌词<br>
      <span id="foot-year"></span>
    </p>
  </div>
</footer>

<script>
(function(){
  'use strict';

  /* ------------------------------------------------------------
     曲目清单由 scripts/build-site.js 从各曲 song.json 自动生成
     ------------------------------------------------------------ */
  var SONGS = /*__SITE_SONGS__*/[];

  var $ = function(s){ return document.querySelector(s); };
  var activeArtist = '';
  var searchQuery = '';
  var currentPage = 1;
  var PAGE_SIZE = 10;
  var collator = new Intl.Collator('ja', { numeric: true, sensitivity: 'base' });

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* 读该曲在本地的掌握进度；没有记录返回 null */
  function progress(slug, total){
    try {
      var raw = localStorage.getItem('jss.' + slug + '.mastery');
      if (!raw) return null;
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr) || !arr.length) return null;
      return Math.min(arr.length, total);
    } catch (e) { return null; }
  }

  var ARROW = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true">'
    + '<path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" '
    + 'stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function renderTally(){
    var sum = SONGS.reduce(function(a, s){
      return {
        lyr: a.lyr + s.scale.lyr,
        lines: a.lines + s.scale.lines,
        vocab: a.vocab + s.scale.vocab,
        grammar: a.grammar + s.scale.grammar
      };
    }, { lyr: 0, lines: 0, vocab: 0, grammar: 0 });

    var items = [
      [sum.lyr, '行 歌 词'],
      [sum.lines, '精 读 句'],
      [sum.vocab, '核 心 词'],
      [sum.grammar, '语 法 点']
    ];

    $('#tally').innerHTML = items.map(function(it){
      return '<div><b>' + it[0] + '</b><span>' + it[1] + '</span></div>';
    }).join('');
  }

  function normalize(text){
    return String(text == null ? '' : text).normalize('NFKC')
      .toLocaleLowerCase().replace(/\s+/g, ' ').trim();
  }

  /* 一首歌可以署多位歌手（合作曲）：artists 参与统计与筛选，artist 只负责展示 */
  function credits(song){
    return song.artists && song.artists.length ? song.artists : [song.artist];
  }

  function onCredit(song, artist){
    return credits(song).indexOf(artist) !== -1;
  }

  function songArtists(){
    return SONGS.reduce(function(list, song){
      credits(song).forEach(function(name){
        if (list.indexOf(name) === -1) list.push(name);
      });
      return list;
    }, []).sort(collator.compare);
  }

  function artistStats(){
    return songArtists().map(function(artist){
      return {
        artist: artist,
        count: SONGS.filter(function(song){ return onCredit(song, artist); }).length
      };
    }).sort(function(a, b){
      return b.count - a.count || collator.compare(a.artist, b.artist);
    });
  }

  function renderArtistTrigger(){
    var count = activeArtist
      ? SONGS.filter(function(song){ return onCredit(song, activeArtist); }).length
      : SONGS.length;
    $('#artist-trigger-label').textContent = (activeArtist || '全部') + ' · ' + count + ' 首';
  }

  function renderArtistOptions(){
    var query = normalize($('#artist-menu-search').value);
    var artists = artistStats().filter(function(item){
      return !query || normalize(item.artist).indexOf(query) !== -1;
    });
    var options = query ? '' :
      '<button type="button" class="artist-option" role="option" data-artist="" aria-selected="'
        + String(activeArtist === '') + '"><span>全部歌手</span><small>' + SONGS.length + ' 首</small></button>';

    options += artists.map(function(item){
      return '<button type="button" class="artist-option" role="option" data-artist="' + esc(item.artist) + '"'
        + ' aria-selected="' + String(item.artist === activeArtist) + '">'
        + '<span lang="ja">' + esc(item.artist) + '</span><small>' + item.count + ' 首</small></button>';
    }).join('');

    if (!artists.length) {
      options += '<p class="artist-option-empty">没有匹配的歌手</p>';
    }
    $('#artist-options').innerHTML = options;
  }

  function setArtistMenu(open, restoreFocus){
    $('#artist-menu').hidden = !open;
    $('#artist-trigger').setAttribute('aria-expanded', String(open));
    if (open) {
      $('#artist-menu-search').value = '';
      renderArtistOptions();
      $('#artist-menu-search').focus();
    } else if (restoreFocus) {
      $('#artist-trigger').focus();
    }
  }

  function matchesSearch(song, query){
    if (!query) return true;
    return [
      song.title.join(' '), song.artist, credits(song).join(' '), song.work, song.year,
      song.level, song.kicker, song.desc
    ].some(function(value){
      return normalize(value).indexOf(query) !== -1;
    });
  }

  /* 首屏前几张不懒加载：既是 LCP 元素，也已在 head 里 preload 过 */
  var EAGER_COVERS = 4;

  function coverFigure(s, titleText, eager){
    return '<figure class="cov cov--img"><picture>'
      + (s.coverWebp ? '<source type="image/webp" srcset="' + esc(s.coverWebp) + '">' : '')
      + '<img src="' + esc(s.cover) + '" alt="' + titleText + ' 封面" width="128" height="128"'
      + (eager ? ' fetchpriority="high" decoding="async"' : ' loading="lazy" decoding="async"')
      + '></picture></figure>';
  }

  function songCard(s, index){
    var lines = s.title.filter(Boolean);
    var titleHtml = lines.map(esc).join('<br>');
    var titleText = lines.map(esc).join(' ');
    var prog = progress(s.slug, s.scale.vocab);
    var progHtml = prog === null ? '' :
      '<span class="song-prog" title="已标记掌握的词汇"><i><b style="width:'
      + Math.round(prog / s.scale.vocab * 100) + '%"></b></i>'
      + prog + '/' + s.scale.vocab + '</span>';

    return '<a class="song" href="' + esc(s.href) + '">'
      + (s.cover
          ? coverFigure(s, titleText, index < EAGER_COVERS)
          : '<figure class="cov t-' + esc(s.tone) + '">'
            + '<div class="cov-top"><span>SINGLE</span><span>' + esc(s.year) + '</span></div>'
            + '<div class="cov-mid">'
            +   '<span class="cov-work">' + esc(s.work) + '</span>'
            +   '<span class="cov-title">' + titleHtml + '</span>'
            +   '<span class="cov-artist" lang="ja">' + esc(s.artist) + '</span>'
            + '</div>'
            + '<div class="cov-foot"><span lang="ja">歌詞精読</span><span>' + esc(s.level) + '</span></div>'
            + '</figure>')
      + '<div class="song-body">'
      +   '<p class="song-kicker" lang="ja">' + esc(s.kicker) + '</p>'
      +   '<h3 class="song-title" lang="ja">' + titleText + '</h3>'
      +   '<p class="song-by"><span lang="ja">' + esc(s.artist) + '</span> · ' + esc(s.year)
      +     '<span class="song-lv" title="大致难度参考，不是考试级别判定">' + esc(s.level) + '</span>'
      +     progHtml + '</p>'
      +   '<p class="song-desc">' + esc(s.desc) + '</p>'
      +   '<div class="song-foot">'
      +     '<span class="song-scale">' + s.scale.lines + ' 句 · ' + s.scale.vocab + ' 词 · ' + s.scale.grammar + ' 语法</span>'
      +     '<span class="song-go">进入 ' + ARROW + '</span>'
      +   '</div>'
      + '</div>'
      + '</a>';
  }

  function pageItems(page, totalPages){
    if (totalPages <= 7) {
      return Array.from({ length: totalPages }, function(_, index){ return index + 1; });
    }

    var items = [1];
    var startPage = Math.max(2, page - 1);
    var endPage = Math.min(totalPages - 1, page + 1);

    if (page <= 3) {
      startPage = 2;
      endPage = 4;
    } else if (page >= totalPages - 2) {
      startPage = totalPages - 3;
      endPage = totalPages - 1;
    }

    if (startPage > 2) items.push('ellipsis-start');
    for (var item = startPage; item <= endPage; item++) items.push(item);
    if (endPage < totalPages - 1) items.push('ellipsis-end');
    items.push(totalPages);
    return items;
  }

  function renderPager(totalSongs, totalPages){
    var showPager = totalPages > 1;
    $('#pager').hidden = !showPager;
    if (!showPager) {
      $('#pager-summary').textContent = '';
      $('#pager-pages').innerHTML = '';
      return;
    }

    $('#pager-summary').textContent = '第 ' + currentPage + ' / ' + totalPages
      + ' 页 · 本页 ' + Math.min(PAGE_SIZE, totalSongs - (currentPage - 1) * PAGE_SIZE) + ' 首';

    var pagesHtml = '<button type="button" data-page="' + (currentPage - 1) + '"'
      + (currentPage === 1 ? ' disabled' : '') + ' aria-label="上一页">上一页</button>';
    pagesHtml += pageItems(currentPage, totalPages).map(function(item){
      if (typeof item === 'string') return '<span class="pager-ellipsis" aria-hidden="true">…</span>';
      return '<button type="button" data-page="' + item + '"'
        + (item === currentPage ? ' aria-current="page"' : '')
        + ' aria-label="第 ' + item + ' 页">' + item + '</button>';
    }).join('');
    pagesHtml += '<button type="button" data-page="' + (currentPage + 1) + '"'
      + (currentPage === totalPages ? ' disabled' : '') + ' aria-label="下一页">下一页</button>';
    $('#pager-pages').innerHTML = pagesHtml;
  }

  function renderSongs(){
    var query = normalize(searchQuery);
    var visibleSongs = SONGS.filter(function(song){
      return (!activeArtist || onCredit(song, activeArtist)) && matchesSearch(song, query);
    });

    var totalPages = Math.ceil(visibleSongs.length / PAGE_SIZE);
    currentPage = Math.min(Math.max(1, currentPage), Math.max(1, totalPages));
    var pageStart = (currentPage - 1) * PAGE_SIZE;
    var pageSongs = visibleSongs.slice(pageStart, pageStart + PAGE_SIZE);

    $('#songs').innerHTML = pageSongs.map(songCard).join('');
    $('#empty').hidden = visibleSongs.length !== 0;
    renderPager(visibleSongs.length, totalPages);

    var artistsOnPage = visibleSongs.reduce(function(list, song){
      credits(song).forEach(function(name){
        if (list.indexOf(name) === -1) list.push(name);
      });
      return list;
    }, []).length;
    var filtering = Boolean(activeArtist || query);
    var count = filtering
      ? visibleSongs.length + ' / ' + SONGS.length + ' 首'
      : visibleSongs.length + ' 首';
    /* 按歌手筛选时不再报「N 位歌手」：合作曲会让这个数字大于 1，看着像出错 */
    $('#list-count').textContent = count + (activeArtist ? '' : ' · ' + artistsOnPage + ' 位歌手');
    $('#foot-year').textContent = new Date().getFullYear();
  }

  renderArtistTrigger();

  $('#artist-trigger').addEventListener('click', function(){
    setArtistMenu($('#artist-menu').hidden, false);
  });

  $('#artist-trigger').addEventListener('keydown', function(event){
    if (event.key === 'ArrowDown') {
      event.preventDefault();
      setArtistMenu(true, false);
    } else if (event.key === 'Escape') {
      setArtistMenu(false, true);
    }
  });

  $('#artist-menu-search').addEventListener('input', renderArtistOptions);
  $('#artist-menu-search').addEventListener('keydown', function(event){
    var options = Array.prototype.slice.call(document.querySelectorAll('#artist-options .artist-option'));
    if (event.key === 'ArrowDown' && options.length) {
      event.preventDefault();
      options[0].focus();
    } else if (event.key === 'ArrowUp' && options.length) {
      event.preventDefault();
      options[options.length - 1].focus();
    } else if (event.key === 'Escape') {
      event.preventDefault();
      setArtistMenu(false, true);
    }
  });

  $('#artist-options').addEventListener('click', function(event){
    var option = event.target.closest('.artist-option');
    if (!option) return;
    activeArtist = option.getAttribute('data-artist');
    currentPage = 1;
    renderArtistTrigger();
    setArtistMenu(false, true);
    renderSongs();
  });

  $('#artist-options').addEventListener('keydown', function(event){
    var options = Array.prototype.slice.call(this.querySelectorAll('.artist-option'));
    var index = options.indexOf(document.activeElement);
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      event.preventDefault();
      var direction = event.key === 'ArrowDown' ? 1 : -1;
      var nextIndex = index < 0 ? 0 : (index + direction + options.length) % options.length;
      options[nextIndex].focus();
    } else if (event.key === 'Home' && options.length) {
      event.preventDefault();
      options[0].focus();
    } else if (event.key === 'End' && options.length) {
      event.preventDefault();
      options[options.length - 1].focus();
    } else if (event.key === 'Escape') {
      event.preventDefault();
      setArtistMenu(false, true);
    }
  });

  document.addEventListener('click', function(event){
    if (!$('#artist-picker').contains(event.target)) setArtistMenu(false, false);
  });
  document.addEventListener('focusin', function(event){
    if (!$('#artist-menu').hidden && !$('#artist-picker').contains(event.target)) {
      setArtistMenu(false, false);
    }
  });

  $('#song-search').addEventListener('input', function(event){
    searchQuery = event.target.value;
    currentPage = 1;
    renderSongs();
  });

  $('#pager').addEventListener('click', function(event){
    var button = event.target.closest('button[data-page]');
    if (!button || button.disabled) return;
    currentPage = Number(button.getAttribute('data-page'));
    renderSongs();
    var currentButton = $('#pager-pages button[aria-current="page"]');
    if (currentButton) currentButton.focus({ preventScroll: true });
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    document.querySelector('.list').scrollIntoView({ block: 'start', behavior: reduceMotion ? 'auto' : 'smooth' });
  });

  $('#reset-directory').addEventListener('click', function(){
    activeArtist = '';
    searchQuery = '';
    currentPage = 1;
    $('#song-search').value = '';
    renderArtistTrigger();
    renderSongs();
    $('#song-search').focus();
  });

  renderTally();
  renderSongs();
})();
</script>
</body>
</html>
