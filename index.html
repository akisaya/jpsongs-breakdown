<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>歌詞精読 · 日语歌词拆解合集</title>
<meta name="description" content="把日文歌拆成 JLPT N3 级精读教材：逐句注音、核心词汇、语法图谱。目前收录 brave heart、again 两首。">
<meta name="theme-color" content="#FBF6EF">
<style>
/* ============================================================
   0. 设计变量（与歌曲页共用同一套）
   ============================================================ */
:root{
  --bg:#FBF6EF;
  --surface:#FFFFFF;
  --ink:#1F232A;
  --ink-2:#4C525C;
  --ink-3:#828893;
  --line:#E8DCCB;
  --orange:#D9541F;
  --teal:#1E8A7E;
  --teal-soft:#E4F2EE;

  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","PingFang SC","Microsoft YaHei",sans-serif;
  --font-serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",Georgia,"Songti SC",serif;
  --font-display:"Didot","Bodoni 72",Georgia,"Times New Roman",serif;

  --shadow-xs:0 1px 2px rgba(84,56,24,.05);
  --shadow-sm:0 1px 2px rgba(84,56,24,.05),0 4px 12px -6px rgba(84,56,24,.14);
  --shadow-md:0 2px 4px rgba(84,56,24,.05),0 14px 34px -14px rgba(84,56,24,.22);

  --r-md:16px;
  --r-lg:22px;
  --r-xl:30px;
}

*,*::before,*::after{box-sizing:border-box}

html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}

body{
  margin:0;
  font-family:var(--font-sans);
  font-size:1rem;
  line-height:1.75;
  color:var(--ink);
  background:
    radial-gradient(1100px 560px at 88% -12%, rgba(255,224,190,.85) 0%, rgba(255,224,190,0) 62%),
    radial-gradient(820px 480px at -8% 4%, rgba(214,238,231,.75) 0%, rgba(214,238,231,0) 58%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
  min-block-size:100vh;
}

.wrap{width:min(100% - 2.5rem, 1000px);margin-inline:auto}
@media (max-width:600px){.wrap{width:calc(100% - 1.8rem)}}

a{color:inherit;text-decoration:none}

/* ============================================================
   1. 顶栏
   ============================================================ */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:1rem;
  padding:1.5rem 0 0;
}
.brand{display:flex;align-items:baseline;gap:.6rem}
.brand b{
  font-family:var(--font-serif);
  font-size:1.02rem;font-weight:600;letter-spacing:.16em;
  color:var(--ink);
}
.brand span{
  font-size:.6rem;letter-spacing:.22em;color:var(--ink-3);
  text-transform:uppercase;
}
.topbar nav{display:flex;align-items:center;gap:1.1rem;font-size:.78rem;color:var(--ink-3)}
.topbar nav a{border-bottom:1px solid transparent;padding-bottom:1px;transition:color .18s,border-color .18s}
.topbar nav a:hover{color:var(--orange);border-color:currentColor}
@media (max-width:560px){.brand span{display:none}}

/* ============================================================
   2. 开场
   ============================================================ */
.intro{padding:clamp(3.2rem,8vw,5.4rem) 0 0}

.intro-kicker{
  margin:0 0 1.1rem;
  font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;
  color:var(--orange);font-weight:700;
}
.intro h1{
  margin:0;
  font-family:var(--font-display);
  font-style:italic;
  font-weight:400;
  font-size:clamp(2.4rem,6.6vw,4.35rem);
  line-height:1.02;
  letter-spacing:-.015em;
  text-wrap:balance;
  color:#262A31;
}
.intro h1 em{
  font-style:inherit;
  background:linear-gradient(96deg,var(--orange) 0%,#C43F1B 46%,#9A3416 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.intro-lead{
  margin:1.5rem 0 0;
  max-width:46ch;
  font-size:.95rem;line-height:1.95;color:var(--ink-2);
  text-wrap:pretty;
}
.intro-lead b{color:var(--ink);font-weight:600}

/* 统计条 */
.tally{
  margin-top:clamp(2.2rem,5vw,3.2rem);
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  background:rgba(255,255,255,.68);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  backdrop-filter:blur(10px);
  box-shadow:var(--shadow-sm);
  overflow:hidden;
}
.tally div{
  padding:1.1rem 1rem;
  text-align:center;
  border-left:1px solid var(--line);
}
.tally div:first-child{border-left:0}
.tally b{
  display:block;
  font-family:var(--font-display);
  font-style:italic;
  font-size:1.75rem;line-height:1.1;
  color:var(--orange);
}
.tally span{
  display:block;margin-top:.28rem;
  font-size:.63rem;letter-spacing:.16em;color:var(--ink-3);
}
@media (max-width:600px){
  .tally{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tally div:nth-child(3){border-left:0}
  .tally div:nth-child(n+3){border-top:1px solid var(--line)}
}

/* ============================================================
   3. 曲目列表
   ============================================================ */
.list{padding:clamp(3.2rem,7vw,4.6rem) 0 0}

.list-head{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:1rem;
  margin-bottom:1.15rem;
}
.list-head h2{
  margin:0;
  font-size:.72rem;font-weight:700;
  letter-spacing:.24em;text-transform:uppercase;
  color:var(--ink-2);
}
.list-head span{font-size:.72rem;color:var(--ink-3);letter-spacing:.06em}

.songs{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:.9rem;
}
@media (max-width:860px){.songs{grid-template-columns:minmax(0,1fr)}}

.song{
  display:flex;align-items:stretch;gap:1rem;
  padding:1rem;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-xs);
  transition:transform .22s cubic-bezier(.2,.7,.3,1),box-shadow .22s ease,border-color .22s ease;
  min-width:0;
}
.song:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow-md);
  border-color:#E2CFB6;
}
.song:focus-visible{
  outline:2px solid var(--orange);
  outline-offset:3px;
}

/* 迷你排版封面 */
.cov{
  --cov:128px;
  flex:0 0 var(--cov);
  inline-size:var(--cov);
  block-size:var(--cov);
  align-self:center;
  margin:0;
  border-radius:12px;
  padding:.5rem .55rem;
  display:flex;flex-direction:column;justify-content:space-between;
  color:#FFF8ED;
  position:relative;overflow:hidden;
  transform:rotate(-2deg);
  transition:transform .3s cubic-bezier(.2,.7,.3,1);
  box-shadow:0 12px 24px -14px rgba(60,30,10,.55);
}
.song:hover .cov{transform:rotate(0deg) scale(1.02)}
.cov::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(to right, rgba(255,255,255,.12) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.12) 1px, transparent 1px);
  background-size:16px 16px;
  -webkit-mask-image:radial-gradient(circle at 50% 30%, #000 0%, transparent 78%);
  mask-image:radial-gradient(circle at 50% 30%, #000 0%, transparent 78%);
}
.cov-top{
  display:flex;justify-content:space-between;gap:.3rem;
  font-size:.4rem;letter-spacing:.13em;opacity:.82;
  position:relative;
}
.cov-mid{position:relative;display:flex;flex-direction:column;gap:.3rem}
.cov-work{font-size:.37rem;letter-spacing:.13em;opacity:.72;text-transform:uppercase}
.cov-title{
  font-family:var(--font-display);font-style:italic;
  font-size:.82rem;line-height:1.08;letter-spacing:-.01em;
  color:#FFFDF8;
}
.cov-artist{font-size:.42rem;letter-spacing:.15em;opacity:.86;margin-top:.1rem}
.cov-foot{
  display:flex;justify-content:space-between;gap:.3rem;
  font-size:.37rem;letter-spacing:.11em;opacity:.8;
  padding-top:.3rem;
  border-top:1px solid rgba(255,255,255,.26);
  position:relative;
}
.cov.t-teal{background:radial-gradient(125% 95% at 76% 8%, #46A99A 0%, #276E76 34%, #123A47 70%, #08202A 100%)}
.cov.t-rust{background:radial-gradient(125% 95% at 76% 8%, #C4664A 0%, #8E3A2A 36%, #4E1D18 72%, #26100E 100%)}

/* 卡片正文 */
.song-body{
  display:flex;flex-direction:column;
  min-width:0;flex:1 1 auto;
  padding-block:.1rem;
}
.song-kicker{
  margin:0;
  font-size:.6rem;letter-spacing:.08em;
  color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.song-title{
  margin:.28rem 0 0;
  font-family:var(--font-display);font-style:italic;font-weight:400;
  font-size:1.42rem;line-height:1.08;letter-spacing:-.01em;
  color:#262A31;
}
.song-by{
  margin:.2rem 0 0;
  font-family:var(--font-serif);
  font-size:.74rem;letter-spacing:.05em;color:var(--ink-2);
}
.song-desc{
  margin:.6rem 0 0;
  font-size:.78rem;line-height:1.72;color:var(--ink-3);
  /* 固定 3 行高度：两列并排时描述长短不一也不会让下半部错位 */
  min-block-size:5.16em;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
  overflow:hidden;
}
.song-foot{
  margin-top:auto;padding-top:.7rem;
  display:flex;align-items:center;justify-content:space-between;
  gap:.6rem;
  font-size:.68rem;color:var(--ink-3);
}
.song-scale{letter-spacing:.02em;white-space:nowrap}
.song-go{
  display:inline-flex;align-items:center;gap:.3rem;
  color:var(--orange);font-weight:600;white-space:nowrap;
  transition:gap .2s ease;
}
.song:hover .song-go{gap:.55rem}
.song-go svg{width:12px;height:12px}

/* 掌握进度：只有该曲有本地记录时才出现 */
.song-prog{
  display:inline-flex;align-items:center;gap:.3rem;
  margin-left:.45rem;padding-left:.5rem;
  border-left:1px solid var(--line);
  color:var(--teal);font-size:.66rem;letter-spacing:.02em;
}
.song-prog i{
  display:block;width:30px;height:3px;border-radius:2px;
  background:#E4EDE9;overflow:hidden;
}
.song-prog i b{display:block;height:100%;background:var(--teal);border-radius:2px}

@media (max-width:520px){
  .cov{--cov:98px;padding:.46rem .5rem}
  .cov-title{font-size:.78rem}
  .cov-work,.cov-top,.cov-foot,.cov-artist{font-size:.35rem}
  .song{gap:.85rem;padding:.9rem}
  .song-title{font-size:1.24rem}
}

/* ============================================================
   4. 页脚
   ============================================================ */
.foot{
  padding:clamp(3rem,6vw,4rem) 0 3rem;
  margin-top:clamp(2.4rem,5vw,3.4rem);
  border-top:1px solid var(--line);
}
.foot-inner{display:flex;flex-wrap:wrap;gap:1.4rem;justify-content:space-between;align-items:flex-start}
.foot-note{
  margin:0;max-width:56ch;
  font-size:.74rem;line-height:1.85;color:var(--ink-3);
  text-wrap:pretty;
}
.foot-meta{
  margin:0;text-align:right;
  font-size:.62rem;letter-spacing:.16em;line-height:2;
  color:var(--ink-3);text-transform:uppercase;
}
@media (max-width:560px){
  .foot-meta{text-align:left}
}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<header class="topbar wrap">
  <a class="brand" href="./">
    <b>歌詞精読</b>
    <span>Lyrics Breakdown</span>
  </a>
  <nav>
    <a href="./brave-heart/index.html">brave heart</a>
    <a href="./again/index.html">again</a>
  </nav>
</header>

<main>
  <section class="intro wrap">
    <p class="intro-kicker">JLPT N3 · 逐句拆解</p>
    <h1>一首歌，<br>就是一份 <em>N3 教材</em></h1>
    <p class="intro-lead">
      每首歌拆成 20 多张卡片：带注音的句子、句中单词、语法点，以及一句「唱的时候才会注意到的细节」。
      不收录完整歌词，只做语言分析——<b>你对着正版音源听，我负责把句子讲透</b>。
    </p>
    <div class="tally" id="tally"></div>
  </section>

  <section class="list wrap">
    <div class="list-head">
      <h2>曲目</h2>
      <span id="list-count"></span>
    </div>
    <div class="songs" id="songs"></div>
  </section>
</main>

<footer class="foot wrap">
  <div class="foot-inner">
    <p class="foot-note">
      本站为日语学习用途的语言分析作品，不提供完整歌词。歌词著作权归各曲作词、作曲、演唱者及相关权利方所有；
      页面仅引用极短片段用于语法与词汇讲解。请通过正版音源与官方歌词页对照收听。
    </p>
    <p class="foot-meta">
      Lyrics Breakdown<br>
      JLPT N3 Study Pages<br>
      <span id="foot-year"></span>
    </p>
  </div>
</footer>

<script>
(function(){
  'use strict';

  /* ------------------------------------------------------------
     曲目清单：加歌时在这里追加一条即可，其余自动渲染
     ------------------------------------------------------------ */
  var SONGS = [
    {
      slug: 'brave-heart',
      href: './brave-heart/index.html',
      kicker: 'Digimon Adventure · Insert Song · 1999',
      work: 'Digimon',
      title: ['brave', 'heart'],
      artist: '宮崎歩',
      year: '1999',
      tone: 'teal',
      desc: '24 行歌词把命令形、意志形、假定形用了个遍。进化曲的句子短、咬字清楚，最合适拿来做影子跟读。',
      scale: { lines: 22, vocab: 61, grammar: 16 }
    },
    {
      slug: 'again-yui',
      href: './again/index.html',
      kicker: '鋼の錬金術師 FA · OP1 · 2009',
      work: 'FMA:B',
      title: ['again'],
      artist: 'YUI',
      year: '2009',
      tone: 'rust',
      desc: '口语缩约最密集的一首：てく、ちゃ、ん、じゃん、らんない 全挤在副歌里。练「听懂日本人真实说话」比练考试语法更有用。',
      scale: { lines: 23, vocab: 68, grammar: 16 }
    }
  ];

  var $ = function(s){ return document.querySelector(s); };

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* 读该曲在本地的掌握进度；没有记录返回 null */
  function progress(slug, total){
    try {
      var raw = localStorage.getItem('jss.' + slug + '.mastery');
      if (!raw) return null;
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr) || !arr.length) return null;
      return Math.min(arr.length, total);
    } catch (e) { return null; }
  }

  var ARROW = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true">'
    + '<path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" '
    + 'stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function renderTally(){
    var sum = SONGS.reduce(function(a, s){
      return {
        lines: a.lines + s.scale.lines,
        vocab: a.vocab + s.scale.vocab,
        grammar: a.grammar + s.scale.grammar
      };
    }, { lines: 0, vocab: 0, grammar: 0 });

    var items = [
      [SONGS.length, '首 歌'],
      [sum.lines, '精 读 句'],
      [sum.vocab, '核 心 词'],
      [sum.grammar, '语 法 点']
    ];

    $('#tally').innerHTML = items.map(function(it){
      return '<div><b>' + it[0] + '</b><span>' + it[1] + '</span></div>';
    }).join('');
  }

  function renderSongs(){
    $('#songs').innerHTML = SONGS.map(function(s){
      var lines = s.title.filter(Boolean);
      var titleHtml = lines.map(esc).join('<br>');
      var titleText = lines.map(esc).join(' ');
      var prog = progress(s.slug, s.scale.vocab);
      var progHtml = prog === null ? '' :
        '<span class="song-prog" title="已标记掌握的词汇"><i><b style="width:'
        + Math.round(prog / s.scale.vocab * 100) + '%"></b></i>'
        + prog + '/' + s.scale.vocab + '</span>';

      return '<a class="song" href="' + esc(s.href) + '">'
        + '<figure class="cov t-' + esc(s.tone) + '">'
        +   '<div class="cov-top"><span>SINGLE</span><span>' + esc(s.year) + '</span></div>'
        +   '<div class="cov-mid">'
        +     '<span class="cov-work">' + esc(s.work) + '</span>'
        +     '<span class="cov-title">' + titleHtml + '</span>'
        +     '<span class="cov-artist">' + esc(s.artist) + '</span>'
        +   '</div>'
        +   '<div class="cov-foot"><span>歌詞精読</span><span>N3</span></div>'
        + '</figure>'
        + '<div class="song-body">'
        +   '<p class="song-kicker">' + esc(s.kicker) + '</p>'
        +   '<h3 class="song-title">' + titleText + '</h3>'
        +   '<p class="song-by">' + esc(s.artist) + ' · ' + esc(s.year) + progHtml + '</p>'
        +   '<p class="song-desc">' + esc(s.desc) + '</p>'
        +   '<div class="song-foot">'
        +     '<span class="song-scale">' + s.scale.lines + ' 句 · ' + s.scale.vocab + ' 词 · ' + s.scale.grammar + ' 语法</span>'
        +     '<span class="song-go">进入 ' + ARROW + '</span>'
        +   '</div>'
        + '</div>'
        + '</a>';
    }).join('');

    $('#list-count').textContent = SONGS.length + ' 首';
    $('#foot-year').textContent = new Date().getFullYear();
  }

  renderTally();
  renderSongs();
})();
</script>
</body>
</html>
